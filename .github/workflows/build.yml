name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\N0vaCacheWallpaperTool.sln

      - name: Build
        run: dotnet build .\N0vaCacheWallpaperTool.sln -c Release --no-restore

      - name: Unit regression
        run: dotnet run --project .\tests\N0vaCacheWallpaperTool.Tests -c Release --no-build

      - name: Integration regression
        run: dotnet run --project .\tests\N0vaCacheWallpaperTool.Integration -c Release --no-build
